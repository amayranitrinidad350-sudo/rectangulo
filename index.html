<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rectángulo</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Rectángulo</h1>
  <h2>Definición de Rectángulo</h2>
  <p>Figura de 4 lados, lados opuestos iguales y 4 ángulos de 90°.</p>
  <h2>Fórmulas y Dibujo</h2>
  <p>Área = base x altura</p>
  <p>Perímetro = 2 x (base + altura)</p>
  <div style="width: 200px; height: 120px; background-color: #a8c8e8; border: 3px solid #173b67; margin: 20px auto;"></div>
  <label>Ingrese base:</label>
  <input type="number" id="base">
  <br><br>
  <label>Ingrese altura:</label>
  <input type="number" id="altura">
  <br><br>
  <button onclick="calcular()">Calcular</button>
  <p id="area"></p>
  <p id="perimetro"></p>

  <p>Elaborado por Díaz Montiel Alan Emanuel y Puntos Trinidad Amayrani</p>
  <script src="script.js"></script>
</body>
</html>
